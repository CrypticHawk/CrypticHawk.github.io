<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechSaverSA | Best Tech Deals in South Africa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><span style="color:#3178c6">TechSaverSA</span> <span style="font-size:1.1rem; color:#555;">Find the best tech deals in South Africa</span></h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <input id="dealSearch" type="text" placeholder="🔍 Search laptops, phones, consoles..." />
      <div id="dealResults"></div>
      <p style="text-align:center; color: #888; margin-top:2rem;">
        Updated daily from <b>Takealot</b>, <b>Loot</b>, <b>Evetech</b>, <b>Incredible Connection</b>, <b>Computer Mania</b>.
      </p>
    </div>
  </main>
  <footer>
    <div class="container">
      <small>
        &copy; 2025 TechSaverSA. All rights reserved.<br>
        As an affiliate, we may earn a commission from qualifying purchases. 
        <a href="privacy.html">Privacy Policy</a>
      </small>
    </div>
  </footer>

  <script>
  // Loads deals.json (from your site root)
  async function loadDeals() {
      let res = await fetch('deals.json');
      let data = await res.json();
      return data;
  }

  function renderDeals(deals, query="") {
      let out = '';
      for (let deal of deals) {
          if (query && !deal.product.toLowerCase().includes(query.toLowerCase()) && !deal.category.toLowerCase().includes(query.toLowerCase())) continue;
          out += `
          <div class="deal">
              <h3>${deal.product}</h3>
              <p><b>Best Price:</b> R${deal.price} @ <b>${deal.store}</b></p>
              <a href="${deal.affiliate_url}" target="_blank" class="cta">View Deal</a>
              <button onclick="showMore('${deal.product.replace(/'/g, "\\'")}')">Show More Offers</button>
              <div id="more-${deal.product.replace(/\s+/g,'-')}" style="display:none;"></div>
          </div>`;
      }
      if (!out) out = "<p>No deals found for your search.</p>";
      document.getElementById('dealResults').innerHTML = out;
  }

  // Show more offers for a product
  async function showMore(product) {
      let res = await fetch('deals.json');
      let data = await res.json();
      let offers = data.all_deals.filter(d => d.product === product);
      let moreDiv = document.getElementById('more-'+product.replace(/\s+/g,'-'));
      if (moreDiv.style.display === "block") {
          moreDiv.style.display = "none";
          return;
      }
      let html = "<ul>";
      for (let o of offers) {
          html += `<li>R${o.price} @ <b>${o.store}</b> <a href="${o.affiliate_url}" target="_blank">View</a></li>`;
      }
      html += "</ul>";
      moreDiv.innerHTML = html;
      moreDiv.style.display = "block";
  }

  window.onload = async () => {
      let data = await loadDeals();
      renderDeals(data.best_deals);

      document.getElementById('dealSearch').addEventListener('input', async (e) => {
          let data = await loadDeals();
          renderDeals(data.best_deals, e.target.value);
      });
  };
  </script>
</body>
</html>
