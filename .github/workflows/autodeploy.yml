name: Auto Update Deals

on:
  schedule:
    - cron:  '0 0 * * *'   # Every day at midnight UTC
  workflow_dispatch:        # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip

      - name: Run deal scraper (generates deals.json)
        run: python scrape_deals_master.py

      # Uncomment the following lines if you still want to generate index.html from Python!
      # - name: Generate index.html (optional)
      #   run: python generate_index.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add deals.json
          # git add index.html  # Uncomment if us

          git push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
